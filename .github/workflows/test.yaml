---
name: Test

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  smoke:
    name: Smoke test add-on
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 🏗️ Build add-on image
        run: docker build -t addman-test ./addman

      - name: 🧪 Run smoke test against mock Supervisor
        run: bash tests/smoke_test.sh addman-test
