---
name: Test

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  smoke:
    name: Smoke test add-on
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: 🏗️ Build add-on image
        run: docker build -t addman-test ./addman

      - name: 🧪 Run smoke test against mock Supervisor
        run: bash tests/smoke_test.sh addman-test
