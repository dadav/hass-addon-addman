---
configuration:
  check_interval:
    name: Prüfinterval
    description: Die Sekunden zwischen den einzelnen Prüfungen/Anpassungen.
  check_updates_x_iterations:
    name: Suche nach Updates
    description: |
      Suche nach Add-on updates wenn die angegeben anzahl an Iterationen
      durchlaufen wurde.

      Setze den Wert auf 0 um diese Funktion zu deaktivieren.
  config_file:
    name: Konfigurationsdatei
    description: Der Pfad zu der Add-on Konfigurationsdatei.
  dry_run:
    name: Testlauf
    description: Protokolliere geplante Änderungen, ohne sie anzuwenden.
  log_level:
    name: Log level
    description: Die Anzahl der Logs die von dem Addon generiert werden.
  notify_persistent:
    name: Dauerhafte Benachrichtigung bei Fehlern
    description: |
      Erstelle eine dauerhafte Home Assistant Benachrichtigung, wenn AddMan
      ein Add-on nicht abgleichen kann (Standard: true). Sie wird entfernt,
      sobald der Fehler behoben ist.
  notify_service:
    name: Benachrichtigungsdienst
    description: |
      Optionaler notify Dienst (z.B. notify.mobile_app_mein_handy), der eine
      Push-Nachricht erhält, wenn ein Fehler auftritt und wenn er behoben ist.
  watch_config_changes:
    name: Add-on Konfig beobachten
    description: Lese die Konfigurationsdatei vor jeder Iteration neu ein.
