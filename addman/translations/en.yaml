---
configuration:
  check_interval:
    name: Check interval
    description: The amount of seconds to wait between each sync.
  check_updates_x_iterations:
    name: Check for updates
    description: |
      After the given amount of iterations were made check if
      there are add-on updates available.

      Disable this by setting it to 0.
  config_file:
    name: Config file
    description: The path to the add-on config file.
  dry_run:
    name: Dry run
    description: Log the planned changes without applying them.
  log_level:
    name: Log level
    description: The amount of logging the add-on should do.
  notify_persistent:
    name: Persistent notification on errors
    description: |
      Create a Home Assistant persistent notification when AddMan fails to
      reconcile an add-on (default: true). It is dismissed once the error
      is resolved.
  notify_service:
    name: Notify service
    description: |
      Optional notify service (e.g. notify.mobile_app_my_phone) that receives
      a push message when an error occurs and when it is resolved.
  watch_config_changes:
    name: Watch config changes
    description: Read the config (config_file) on every iteration.
